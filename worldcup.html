<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    font-family: 'Roboto', Arial, sans-serif;
    background: #000;
  }
  #scroll-root {
    width: 100%; height: 100vh;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  #scroll-root::-webkit-scrollbar { display: none; }
  #app { width: 100%; }
  .error-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 12px;
    color: #888; font-size: 14px; text-align: center;
  }
  .error-screen .et { font-size: 26px; font-weight: 900; color: #fff; }
</style>
</head>
<body>
<div id="scroll-root"><div id="app"></div></div>
<script>
'use strict';

// ── Costanti colori ───────────────────────────────────────────
const C = {
  gold:     '#c9a84c',
  gold2:    '#f0d060',
  white:    '#ffffff',
  muted:    '#7a7a9a',
  box:      'rgba(10,10,30,0.72)',
  boxWin:   'rgba(201,168,76,0.22)',
  line:     'rgba(255,255,255,0.25)',
  lineWin:  '#c9a84c',
  border:   'rgba(255,255,255,0.18)',
  borderW:  '#c9a84c',
  elim:     'rgba(255,255,255,0.06)',
};

const FLAG_FB = 'https://flagcdn.com/w40/un.png';

// ── SVG helper ────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
let _clipN = 0;

function se(tag, a={}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k, String(v));
  return e;
}
function st(text, a={}) {
  const e = se('text', a);
  e.textContent = text;
  return e;
}
function ap(parent, ...children) {
  for (const c of children) if (c) parent.appendChild(c);
  return parent;
}

// ── Layout 1920×1080 ──────────────────────────────────────────
const VW = 1920, VH = 1080, CX = 960;
const BOX_W = 155, BOX_H = 52, ROW_H = 26;
const FLAG_S = 18, FLAG_R = 9;   // dimensione quadrato bandiera, raggio cerchio
const TOP_PAD = 108, BOT_PAD = 20;
const SLOT_H = Math.floor((VH - TOP_PAD - BOT_PAD) / 8);

// X sinistra di ogni colonna-box
const X = {
  r32L: 22,
  r16L: 210,
  qfL:  382,
  sfL:  542,
  fin:  CX - Math.floor(BOX_W/2),
  sfR:  VW - 542 - BOX_W,
  qfR:  VW - 382 - BOX_W,
  r16R: VW - 210 - BOX_W,
  r32R: VW - 22  - BOX_W,
};

function slotY(i)  { return TOP_PAD + i * SLOT_H + Math.floor((SLOT_H - BOX_H) / 2); }
function slotCY(i) { return slotY(i) + BOX_H / 2; }
function r16CY(i)  { return (slotCY(2*i) + slotCY(2*i+1)) / 2; }
function qfCY(i)   { return (r16CY(2*i) + r16CY(2*i+1)) / 2; }
function sfCY(i)   { return (qfCY(2*i) + qfCY(2*i+1)) / 2; }

// ── Disegna un singolo box match ──────────────────────────────
function drawBox(g, defs, match, bx, by, flip=false) {
  // bx = x bordo SINISTRO del box (anche per lato destro)
  const winner = match?.winner || null;

  function drawRow(team, ry, isWin, isElim) {
    const name  = team?.name   || null;
    const ph    = team?.placeholder || 'TBD';
    const flag  = team?.flag   || FLAG_FB;
    const opacity = isElim ? 0.3 : 1;

    const rg = se('g', { opacity });

    // Sfondo riga vincitore
    if (isWin) {
      ap(rg, se('rect', { x: bx, y: ry, width: BOX_W, height: ROW_H, fill: C.boxWin }));
    }

    // Bandiera circolare
    const fcx = bx + 6 + FLAG_R;
    const fcy = ry + ROW_H/2;
    const cid = 'fc' + (++_clipN);
    ap(defs, ap(se('clipPath', { id: cid }),
      se('circle', { cx: fcx, cy: fcy, r: FLAG_R })
    ));

    if (name) {
      ap(rg,
        se('circle', { cx: fcx, cy: fcy, r: FLAG_R+1,
          fill: 'none',
          stroke: isWin ? C.gold : C.border,
          'stroke-width': isWin ? 1.5 : 1
        }),
        ap(se('g', { 'clip-path': `url(#${cid})` }),
          (() => {
            const img = se('image', {
              href: flag,
              x: fcx - FLAG_R, y: fcy - FLAG_R,
              width: FLAG_R*2, height: FLAG_R*2,
              preserveAspectRatio: 'xMidYMid slice'
            });
            img.setAttribute('onerror', `this.setAttribute('href','${FLAG_FB}')`);
            return img;
          })()
        )
      );
    } else {
      ap(rg,
        se('circle', { cx: fcx, cy: fcy, r: FLAG_R, fill: 'rgba(255,255,255,0.06)', stroke: C.muted, 'stroke-width':1 }),
        st('?', { x: fcx, y: fcy+4, 'text-anchor':'middle', 'font-size':10, fill: C.muted, 'font-weight':700 })
      );
    }

    // Testo nome/placeholder
    const tx = bx + 6 + FLAG_R*2 + 6;
    const tw = BOX_W - (6 + FLAG_R*2 + 6) - 4;
    const tcid = 'tc' + (++_clipN);
    ap(defs, ap(se('clipPath', { id: tcid }),
      se('rect', { x: tx, y: ry, width: tw, height: ROW_H })
    ));
    ap(rg, st(name || ph, {
      x: tx, y: ry + ROW_H/2 + 5,
      'font-size': name ? 11 : 9,
      fill: name ? (isWin ? C.gold2 : C.white) : C.muted,
      'font-style': name ? 'normal' : 'italic',
      'font-weight': isWin ? 700 : 500,
      'clip-path': `url(#${tcid})`
    }));

    g.appendChild(rg);
  }

  // Box background + border
  const homeWin = winner && match?.home?.name && winner === match.home.name;
  const awayWin = winner && match?.away?.name && winner === match.away.name;
  const hasBoth = match?.home?.name && match?.away?.name;

  ap(g,
    se('rect', { x: bx, y: by, width: BOX_W, height: BOX_H, rx:5,
      fill: C.box,
      stroke: (homeWin || awayWin) ? C.gold : C.border,
      'stroke-width': (homeWin || awayWin) ? 1.5 : 1
    }),
    // separatore riga
    se('line', { x1: bx, y1: by+ROW_H, x2: bx+BOX_W, y2: by+ROW_H,
      stroke: 'rgba(255,255,255,0.08)', 'stroke-width':1 })
  );

  drawRow(match?.home, by,        homeWin, !homeWin && awayWin);
  drawRow(match?.away, by+ROW_H,  awayWin, !awayWin && homeWin);

  // Connettore sinistro e destro del box (punti medi)
  return {
    midLeft:  { x: bx,          y: by + BOX_H/2 },
    midRight: { x: bx + BOX_W,  y: by + BOX_H/2 },
    topRight: { x: bx + BOX_W,  y: by + BOX_H/2 },
  };
}

// ── Linea connettore ──────────────────────────────────────────
function conn(g, x1, y1, x2, y2, color=C.line) {
  // Traccia: orizzontale da x1→metà, verticale, poi orizzontale→x2
  const mx = (x1 + x2) / 2;
  ap(g, se('path', {
    d: `M${x1},${y1} H${mx} V${y2} H${x2}`,
    stroke: color, 'stroke-width': 1.5, fill: 'none',
    'stroke-linecap': 'round'
  }));
}

function hline(g, x1, x2, y, color=C.line) {
  ap(g, se('line', { x1, y1: y, x2, y2: y, stroke: color, 'stroke-width': 1.5, 'stroke-linecap':'round' }));
}

// ── Etichetta colonna ─────────────────────────────────────────
function colLabel(g, label, cx, y=TOP_PAD-18) {
  ap(g, st(label, {
    x: cx, y,
    'text-anchor':'middle',
    'font-size': 13, fill: 'rgba(255,255,255,0.45)',
    'font-weight': 700, 'letter-spacing': 3,
    'text-transform': 'uppercase'
  }));
}

// ── Costruisce l'SVG completo ─────────────────────────────────
function buildSVG(data) {
  const b   = data.bracket;
  const r32 = b.round_of_32      || [];
  const r16 = b.round_of_16      || [];
  const qf  = b.quarter_finals   || [];
  const sf  = b.semi_finals      || [];
  const tp  = b.third_place;
  const fin = b.final;

  const svg = se('svg', {
    viewBox: `0 0 ${VW} ${VH}`,
    xmlns: NS,
    style: 'display:block;width:100%;height:auto'
  });

  const defs = se('defs');
  svg.appendChild(defs);

  // Sfondo immagine
  const bgImg = se('image', {
    href: 'assets/bg.jpg',
    x: 0, y: 0, width: VW, height: VH,
    preserveAspectRatio: 'xMidYMid slice'
  });
  svg.appendChild(bgImg);

  // Overlay scuro per leggibilità
  svg.appendChild(se('rect', { x:0, y:0, width:VW, height:VH, fill:'rgba(0,0,0,0.62)' }));

  // Layer linee (sotto i box)
  const gLines = se('g', { id:'lines' });
  svg.appendChild(gLines);

  // Layer box
  const gBoxes = se('g', { id:'boxes' });
  svg.appendChild(gBoxes);

  // Layer testo sopra tutto
  const gText = se('g', { id:'text' });
  svg.appendChild(gText);

  // ── Etichette colonne ─────────────────────────────────────
  colLabel(gText, 'OTTAVI',     X.r32L + BOX_W/2);
  colLabel(gText, 'QUARTI',     X.r16L + BOX_W/2);
  colLabel(gText, 'SEMIFINALI', X.qfL  + BOX_W/2);
  colLabel(gText, 'FINALE',     X.sfL  + BOX_W/2);
  colLabel(gText, 'FINALE',     X.sfR  + BOX_W/2);
  colLabel(gText, 'SEMIFINALI', X.qfR  + BOX_W/2);
  colLabel(gText, 'QUARTI',     X.r16R + BOX_W/2);
  colLabel(gText, 'OTTAVI',     X.r32R + BOX_W/2);

  // ══ LATO SINISTRO ══════════════════════════════════════════
  // R32 sinistra: match 0-7
  for (let i = 0; i < 8; i++) {
    const by = slotY(i);
    drawBox(gBoxes, defs, r32[i], X.r32L, by);
    // Linea orizzontale R32→R16
    hline(gLines, X.r32L + BOX_W, X.r16L, slotCY(i));
  }

  // Connettori verticali R32→R16 (unisce coppie)
  for (let i = 0; i < 4; i++) {
    const y1 = slotCY(2*i);
    const y2 = slotCY(2*i+1);
    const mx = X.r16L;
    ap(gLines, se('line', { x1:mx, y1, x2:mx, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // R16 sinistra: match 0-3
  for (let i = 0; i < 4; i++) {
    const cy = r16CY(i);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, r16[i], X.r16L, by);
    hline(gLines, X.r16L + BOX_W, X.qfL, cy);
  }

  // Connettori verticali R16→QF sinistra
  for (let i = 0; i < 2; i++) {
    const y1 = r16CY(2*i);
    const y2 = r16CY(2*i+1);
    ap(gLines, se('line', { x1:X.qfL, y1, x2:X.qfL, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // QF sinistra: qf[0], qf[1]
  for (let i = 0; i < 2; i++) {
    const cy = qfCY(i);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, qf[i], X.qfL, by);
    hline(gLines, X.qfL + BOX_W, X.sfL, cy);
  }

  // Connettore verticale QF→SF sinistra
  {
    const y1 = qfCY(0), y2 = qfCY(1);
    ap(gLines, se('line', { x1:X.sfL, y1, x2:X.sfL, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // SF sinistra: sf[0]
  {
    const cy = sfCY(0);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, sf[0], X.sfL, by);
    hline(gLines, X.sfL + BOX_W, X.fin, cy);
  }

  // ══ LATO DESTRO ════════════════════════════════════════════
  // R32 destra: match 8-15
  for (let i = 0; i < 8; i++) {
    const by = slotY(i);
    drawBox(gBoxes, defs, r32[8+i], X.r32R, by);
    hline(gLines, X.r16R + BOX_W, X.r32R, slotCY(i));
  }

  // Connettori verticali R32→R16 destra
  for (let i = 0; i < 4; i++) {
    const y1 = slotCY(2*i), y2 = slotCY(2*i+1);
    const lx = X.r16R + BOX_W;
    ap(gLines, se('line', { x1:lx, y1, x2:lx, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // R16 destra: match 4-7
  for (let i = 0; i < 4; i++) {
    const cy = r16CY(i);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, r16[4+i], X.r16R, by);
    hline(gLines, X.qfR + BOX_W, X.r16R, cy);
  }

  // Connettori verticali R16→QF destra
  for (let i = 0; i < 2; i++) {
    const y1 = r16CY(2*i), y2 = r16CY(2*i+1);
    const lx = X.qfR + BOX_W;
    ap(gLines, se('line', { x1:lx, y1, x2:lx, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // QF destra: qf[2], qf[3]
  for (let i = 0; i < 2; i++) {
    const cy = qfCY(i);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, qf[2+i], X.qfR, by);
    hline(gLines, X.sfR + BOX_W, X.qfR, cy);
  }

  // Connettore verticale QF→SF destra
  {
    const y1 = qfCY(0), y2 = qfCY(1);
    const lx = X.sfR + BOX_W;
    ap(gLines, se('line', { x1:lx, y1, x2:lx, y2, stroke:C.line, 'stroke-width':1.5 }));
  }

  // SF destra: sf[1]
  {
    const cy = sfCY(0);
    const by = cy - BOX_H/2;
    drawBox(gBoxes, defs, sf[1], X.sfR, by);
    hline(gLines, X.sfR, X.fin + BOX_W, cy);
  }

  // ══ CENTRO ═════════════════════════════════════════════════
  const finCY = VH / 2 - 60;
  const finY  = finCY - BOX_H/2;

  // Linee verticali SF→Finale
  {
    const sfLCY = sfCY(0);
    const sfRCY = sfCY(0);
    ap(gLines,
      se('line', { x1: X.fin,          y1: sfLCY, x2: X.fin,          y2: finCY, stroke:C.line, 'stroke-width':1.5 }),
      se('line', { x1: X.fin + BOX_W,  y1: sfRCY, x2: X.fin + BOX_W,  y2: finCY, stroke:C.line, 'stroke-width':1.5 })
    );
  }

  // Label "CAMPIONE DEL MONDO"
  ap(gText,
    st('CAMPIONE DEL MONDO', {
      x: CX, y: finY - 28,
      'text-anchor':'middle', 'font-size':14,
      fill: C.gold, 'font-weight':800, 'letter-spacing':4
    })
  );

  // Finale
  drawBox(gBoxes, defs, fin, X.fin, finY);

  // Trofeo (immagine locale)
  {
    const tW = 80, tH = 160;
    const tx = CX - tW/2;
    const ty = finY + BOX_H + 8;
    const tImg = se('image', {
      href: 'assets/trophy.png',
      x: tx, y: ty, width: tW, height: tH,
      preserveAspectRatio: 'xMidYMid meet'
    });
    svg.appendChild(tImg);

    // "3° POSTO" label
    ap(gText, st('3° POSTO', {
      x: CX, y: ty + tH + 16,
      'text-anchor':'middle', 'font-size':11,
      fill: 'rgba(255,255,255,0.5)', 'font-weight':700, 'letter-spacing':3
    }));

    // Box terzo posto
    const tpY = ty + tH + 24;
    drawBox(gBoxes, defs, tp, X.fin, tpY);
  }

  // ── HEADER ─────────────────────────────────────────────────
  // Overlay header
  ap(svg, se('rect', { x:0, y:0, width:VW, height:TOP_PAD-4,
    fill:'rgba(0,0,0,0.45)' }));

  const dt = data.lastUpdated ? new Date(data.lastUpdated) : null;
  const updStr = dt
    ? dt.toLocaleDateString('it-IT') + ' ' + dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})
    : '';

  ap(gText,
    st('FIFA WORLD CUP 2026', {
      x: CX, y: 58,
      'text-anchor':'middle', 'font-size':38,
      fill: C.white, 'font-weight':900, 'letter-spacing':3
    }),
    st(updStr ? `Aggiornato: ${updStr}` : '', {
      x: CX, y: 84,
      'text-anchor':'middle', 'font-size':14,
      fill:'rgba(255,255,255,0.45)', 'font-weight':400
    })
  );

  return svg;
}

// ── Main ──────────────────────────────────────────────────────
async function load() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('data/worldcup.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    app.innerHTML = '';
    app.appendChild(buildSVG(data));
  } catch(e) {
    app.innerHTML = `<div class="error-screen">
      <div class="et">FIFA WORLD CUP 2026</div>
      <div>Dati non disponibili.</div>
      <div style="font-size:11px;opacity:.4;margin-top:4px;">Riprova più tardi.</div>
    </div>`;
  }
}

load();
</script>
</body>
</html>
