<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    font-family: 'Roboto', Arial, sans-serif;
    background: #000;
  }
  #scroll-root {
    width: 100%; height: 100vh;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  #scroll-root::-webkit-scrollbar { display: none; }
  #app { width: 100%; }
  .error-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 12px;
    color: #888; font-size: 16px; text-align: center;
    background: #050510;
  }
  .error-screen .et { font-size: 30px; font-weight: 900; color: #fff; }
</style>
</head>
<body>
<div id="scroll-root"><div id="app"></div></div>
<script>
'use strict';

const C = {
  gold:    '#c9a84c',
  gold2:   '#f0d878',
  white:   '#ffffff',
  muted:   '#9999bb',
  boxBg:   'rgba(8,8,24,0.78)',
  winBg:   'rgba(201,168,76,0.22)',
  line:    '#5ec8ff',
  border:  'rgba(255,255,255,0.22)',
  borderW: '#c9a84c',
};
const FLAG_FB = 'https://flagcdn.com/w40/un.png';
const NS = 'http://www.w3.org/2000/svg';
let _cn = 0;

function se(tag, a={}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k, String(v));
  return e;
}
function st(text, a={}) { const e=se('text',a); e.textContent=text; return e; }
function ap(p,...ch) { for(const c of ch) if(c) p.appendChild(c); return p; }

// ── Layout (NO HEADER — guadagnato spazio per box più grandi) ──
const VW=1920, VH=1080, CX=960;
const BOX_W=162, BOX_H=86, ROW_H=43;
const FLAG_R=17;          // raggio bandiera (diametro 34px)
const TOP_PAD=56, BOT_PAD=14;
const SLOT_H = Math.floor((VH - TOP_PAD - BOT_PAD) / 8);  // ~126px

const X = {
  r32L: 16,
  r16L: 202,
  qfL:  388,
  sfL:  574,
  fin:  CX - Math.floor(BOX_W/2),
  sfR:  VW - 574 - BOX_W,
  qfR:  VW - 388 - BOX_W,
  r16R: VW - 202 - BOX_W,
  r32R: VW - 16  - BOX_W,
};

function slotY(i)  { return TOP_PAD + i*SLOT_H + Math.floor((SLOT_H-BOX_H)/2); }
function slotCY(i) { return slotY(i) + BOX_H/2; }
function r16CY(i)  { return (slotCY(2*i)+slotCY(2*i+1))/2; }
function qfCY(i)   { return (r16CY(2*i)+r16CY(2*i+1))/2; }
function sfCY()    { return (qfCY(0)+qfCY(1))/2; }

// ── Box match ────────────────────────────────────────────────
function drawBox(parent, defs, match, bx, by) {
  const winner = match?.winner || null;
  const homeWin = winner && match?.home?.name && winner===match.home.name;
  const awayWin = winner && match?.away?.name && winner===match.away.name;

  ap(parent,
    se('rect',{x:bx,y:by,width:BOX_W,height:BOX_H,rx:7,
      fill:C.boxBg,
      stroke:(homeWin||awayWin)?C.borderW:C.border,
      'stroke-width':(homeWin||awayWin)?2.2:1.2}),
    se('line',{x1:bx,y1:by+ROW_H,x2:bx+BOX_W,y2:by+ROW_H,
      stroke:'rgba(255,255,255,0.12)','stroke-width':1})
  );

  function drawRow(team, ry, isWin, isElim) {
    const name = team?.name || null;
    let ph     = team?.placeholder || 'TBD';
    // Accorcia "Vincente Match 74" -> "Vincente", "Perdente Match 101" -> "Perdente"
    if (/^Vincente/i.test(ph)) ph = 'Vincente';
    else if (/^Perdente/i.test(ph)) ph = 'Perdente';
    const flag = team?.flag || FLAG_FB;
    const op   = isElim ? 0.28 : 1;
    const g    = se('g',{opacity:op});

    if (isWin) ap(g, se('rect',{x:bx,y:ry,width:BOX_W,height:ROW_H,fill:C.winBg}));

    const fcx = bx + 9 + FLAG_R;
    const fcy = ry + ROW_H/2;
    const cid = 'f'+(++_cn);
    ap(defs, ap(se('clipPath',{id:cid}), se('circle',{cx:fcx,cy:fcy,r:FLAG_R})));

    if (name) {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R+2,
          fill:'none', stroke:isWin?C.gold:C.border,
          'stroke-width':isWin?2.5:1.3}),
        ap(se('g',{'clip-path':`url(#${cid})`}), (()=>{
          const img=se('image',{
            href:flag, x:fcx-FLAG_R, y:fcy-FLAG_R,
            width:FLAG_R*2, height:FLAG_R*2,
            preserveAspectRatio:'xMidYMid slice'
          });
          img.setAttribute('onerror',`this.setAttribute('href','${FLAG_FB}')`);
          return img;
        })())
      );
    } else {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R,fill:'rgba(255,255,255,0.05)',stroke:C.muted,'stroke-width':1.3}),
        st('?',{x:fcx,y:fcy+6,'text-anchor':'middle','font-size':17,fill:C.muted,'font-weight':800})
      );
    }

    const tx = bx + 9 + FLAG_R*2 + 16;
    const tw = BOX_W - (9+FLAG_R*2+16) - 7;
    const tcid = 'n'+(++_cn);
    ap(defs, ap(se('clipPath',{id:tcid}), se('rect',{x:tx,y:ry,width:tw,height:ROW_H})));
    ap(g, st(name||ph, {
      x:tx, y:ry+ROW_H/2+7,
      'font-size': name?18:15,
      fill: name?(isWin?C.gold2:C.white):C.gold2,
      'font-style': 'normal',
      'font-weight': name?(isWin?800:600):800,
      'clip-path':`url(#${tcid})`
    }));

    parent.appendChild(g);
  }

  drawRow(match?.home, by,       homeWin, !homeWin&&awayWin);
  drawRow(match?.away, by+ROW_H, awayWin, !awayWin&&homeWin);
}

// ── Connettori ────────────────────────────────────────────────
function hline(g, x1, x2, y) {
  ap(g, se('line',{x1,y1:y,x2,y2:y,stroke:C.line,'stroke-width':2,'stroke-linecap':'round'}));
}
function vline(g, x, y1, y2) {
  ap(g, se('line',{x1:x,y1,x2:x,y2,stroke:C.line,'stroke-width':2,'stroke-linecap':'round'}));
}
function colLabel(g, label, cx, y) {
  ap(g, st(label,{x:cx,y,'text-anchor':'middle','font-size':18,
    fill:'rgba(255,255,255,0.55)','font-weight':900,'letter-spacing':3.5}));
}

// ── SVG principale ────────────────────────────────────────────
function buildSVG(data) {
  const b   = data.bracket;
  const r32 = b.round_of_32    || [];
  const r16 = b.round_of_16    || [];
  const qf  = b.quarter_finals || [];
  const sf  = b.semi_finals    || [];
  const tp  = b.third_place;
  const fin = b.final;

  const svg = se('svg',{viewBox:`0 0 ${VW} ${VH}`,xmlns:NS,
    style:'display:block;width:100%;height:auto'});

  const defs = se('defs');
  svg.appendChild(defs);

  const bgImg = se('image',{href:'assets/bg.jpg',x:0,y:0,width:VW,height:VH,
    preserveAspectRatio:'xMidYMid slice'});
  svg.appendChild(bgImg);
  svg.appendChild(se('rect',{x:0,y:0,width:VW,height:VH,fill:'rgba(20,22,35,0.45)'}));

  const gL = se('g',{id:'lines'});
  const gB = se('g',{id:'boxes'});
  const gT = se('g',{id:'top'});
  ap(svg, gL, gB, gT);

  // ── Etichette fase (allineate con la posizione delle colonne) ──
  const LY = TOP_PAD - 16;
  colLabel(gT,'OTTAVI',    X.r32L+BOX_W/2, LY);
  colLabel(gT,'QUARTI',    X.r16L+BOX_W/2, LY);
  colLabel(gT,'SEMIFINALI',X.qfL +BOX_W/2, LY);
  colLabel(gT,'FINALE',    X.sfL +BOX_W/2, LY);
  colLabel(gT,'FINALE',    X.sfR +BOX_W/2, LY);
  colLabel(gT,'SEMIFINALI',X.qfR +BOX_W/2, LY);
  colLabel(gT,'QUARTI',    X.r16R+BOX_W/2, LY);
  colLabel(gT,'OTTAVI',    X.r32R+BOX_W/2, LY);

  // ══ LATO SINISTRO ══════════════════════════════════════════
  for (let i=0;i<8;i++) {
    drawBox(gB, defs, r32[i], X.r32L, slotY(i));
    hline(gL, X.r32L+BOX_W, X.r16L, slotCY(i));
  }
  for (let i=0;i<4;i++) vline(gL, X.r16L, slotCY(2*i), slotCY(2*i+1));

  for (let i=0;i<4;i++) {
    drawBox(gB, defs, r16[i], X.r16L, r16CY(i)-BOX_H/2);
    hline(gL, X.r16L+BOX_W, X.qfL, r16CY(i));
  }
  for (let i=0;i<2;i++) vline(gL, X.qfL, r16CY(2*i), r16CY(2*i+1));

  for (let i=0;i<2;i++) {
    drawBox(gB, defs, qf[i], X.qfL, qfCY(i)-BOX_H/2);
    hline(gL, X.qfL+BOX_W, X.sfL, qfCY(i));
  }
  vline(gL, X.sfL, qfCY(0), qfCY(1));

  const sfLY = sfCY();
  drawBox(gB, defs, sf[0], X.sfL, sfLY-BOX_H/2);
  hline(gL, X.sfL+BOX_W, X.fin, sfLY);

  // ══ LATO DESTRO ════════════════════════════════════════════
  for (let i=0;i<8;i++) {
    drawBox(gB, defs, r32[8+i], X.r32R, slotY(i));
    hline(gL, X.r16R+BOX_W, X.r32R, slotCY(i));
  }
  for (let i=0;i<4;i++) vline(gL, X.r16R+BOX_W, slotCY(2*i), slotCY(2*i+1));

  for (let i=0;i<4;i++) {
    drawBox(gB, defs, r16[4+i], X.r16R, r16CY(i)-BOX_H/2);
    hline(gL, X.qfR+BOX_W, X.r16R, r16CY(i));
  }
  for (let i=0;i<2;i++) vline(gL, X.qfR+BOX_W, r16CY(2*i), r16CY(2*i+1));

  for (let i=0;i<2;i++) {
    drawBox(gB, defs, qf[2+i], X.qfR, qfCY(i)-BOX_H/2);
    hline(gL, X.sfR+BOX_W, X.qfR, qfCY(i));
  }
  vline(gL, X.sfR+BOX_W, qfCY(0), qfCY(1));

  const sfRY = sfCY();
  drawBox(gB, defs, sf[1], X.sfR, sfRY-BOX_H/2);
  hline(gL, X.fin+BOX_W, X.sfR, sfRY);

  // ══ CENTRO ══════════════════════════════════════════════════
  const finCY = Math.round(VH*0.34);
  const finY  = finCY - BOX_H/2;

  vline(gL, X.fin,       sfLY, finCY);
  vline(gL, X.fin+BOX_W, sfRY, finCY);

  ap(gT, st('CAMPIONE DEL MONDO',{
    x:CX,y:finY-26,'text-anchor':'middle',
    'font-size':21,fill:C.gold,'font-weight':900,'letter-spacing':5
  }));

  drawBox(gB, defs, fin, X.fin, finY);

  const tW=100, tH=200;
  const tY = finY + BOX_H + 14;
  const tImg = se('image',{
    href:'assets/trophy.png',
    x:CX-tW/2, y:tY, width:tW, height:tH,
    preserveAspectRatio:'xMidYMid meet'
  });
  svg.appendChild(tImg);

  const tpLabelY = tY + tH + 14;
  const tpY = tpLabelY + 14;
  ap(gT, st('FINALE 3° POSTO',{
    x:CX,y:tpLabelY,'text-anchor':'middle',
    'font-size':14,fill:'rgba(255,255,255,0.55)','font-weight':800,'letter-spacing':2.5
  }));
  drawBox(gB, defs, tp, X.fin, tpY);

  return svg;
}

// ── Main ─────────────────────────────────────────────────────
async function load() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('data/worldcup.json?v='+Date.now());
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    app.innerHTML = '';
    app.appendChild(buildSVG(data));
  } catch(e) {
    app.innerHTML = `<div class="error-screen">
      <div class="et">FIFA WORLD CUP 2026</div>
      <div>Dati non disponibili.</div>
      <div style="font-size:12px;opacity:.4;margin-top:6px;">Riprova più tardi.</div>
    </div>`;
  }
}

load();
</script>
</body>
</html>
