<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    font-family: 'Roboto', Arial, sans-serif;
    background: #000;
  }
  #scroll-root {
    width: 100%; height: 100vh;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  #scroll-root::-webkit-scrollbar { display: none; }
  #app { width: 100%; }
  .error-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 12px;
    color: #888; font-size: 16px; text-align: center;
    background: #050510;
  }
  .error-screen .et { font-size: 30px; font-weight: 900; color: #fff; }
</style>
</head>
<body>
<div id="scroll-root"><div id="app"></div></div>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   FIFA World Cup 2026 — Tabellone dagli OTTAVI (Round of 16).
   I Sedicesimi non vengono disegnati: la base dell'albero sono gli
   ottavi (4 match per lato). Questo raddoppia lo spazio verticale
   per ogni box → bandiere e nomi più grandi e leggibili.
   round_of_32 nel JSON viene ignorato; se un ottavo non è ancora
   determinato mostra il placeholder "Vincente ...".
   ══════════════════════════════════════════════════════════════ */

const C = {
  gold:     '#c9a84c',
  gold2:    '#f0d878',
  bronze:   '#cd7f32',
  bronze2:  '#e8a868',
  white:    '#ffffff',
  muted:    '#9999bb',
  boxBg:    'rgba(8,8,24,0.80)',
  winBg:    'rgba(201,168,76,0.22)',
  line:     '#0d1b3e',
  lineEdge: '#e23b3b',
  border:   'rgba(255,255,255,0.22)',
  borderW:  '#c9a84c',
  navyText: '#0d1b3e',
};
const FLAG_FB = 'https://flagcdn.com/w40/un.png';
const NS = 'http://www.w3.org/2000/svg';
let _cn = 0;

function se(tag, a={}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k, String(v));
  return e;
}
function st(text, a={}) { const e=se('text',a); e.textContent=text; return e; }
function ap(p,...ch) { for(const c of ch) if(c) p.appendChild(c); return p; }

// ── Risoluzione dei "genitori" di un match ──────────────────────
// Tollerante ai formati: "Vincente Match 89", "Winner match 89"
// (FIFA/openfootball, m minuscola) e "Vincente M89". Se il match è
// già giocato e il placeholder è stato sostituito dal nome squadra,
// si risale al genitore confrontando il winner del round precedente.
function refFromPlaceholder(ph) {
  const mm = (ph || '').match(/\b[Mm](?:atch)?\s*(\d+)/);
  return mm ? parseInt(mm[1], 10) : null;
}
function findOriginNum(side, prevByNum) {
  const r = refFromPlaceholder(side?.placeholder);
  if (r !== null) return r;
  if (side?.name) {
    for (const numStr in prevByNum) {
      if (prevByNum[numStr].winner === side.name) return parseInt(numStr, 10);
    }
  }
  return null;
}
function parentNums(m, prevByNum) {
  return ['home','away']
    .map(s => findOriginNum(m[s], prevByNum))
    .filter(n => n !== null);
}

// ── Ordine degli Ottavi derivato dall'albero (top-down) ─────────
// La geometria a slot fissi funziona solo se round_of_16 è in ordine
// "ad albero" (slot 0-1 alimentano lo stesso quarto, ecc.). Non ci si
// fida dell'ordine dell'array: lo deriviamo con una DFS in-order dalla
// Finale scendendo per i veri genitori. Indipendente dall'ordine dei dati.
function computeR16Order(b) {
  const by = a => { const o = {}; (a || []).forEach(m => o[m.matchNumber] = m); return o; };
  const R16 = by(b.round_of_16), QF = by(b.quarter_finals), SF = by(b.semi_finals);
  const leaves = [];
  const dfsQF = m => parentNums(m, R16).forEach(n => { if (R16[n]) leaves.push(n); });
  const dfsSF = m => parentNums(m, QF ).forEach(n => { if (QF[n])  dfsQF(QF[n]); });
  if (b.final) parentNums(b.final, SF).forEach(n => { if (SF[n]) dfsSF(SF[n]); });
  (b.round_of_16 || []).forEach(m => {
    if (!leaves.includes(m.matchNumber)) leaves.push(m.matchNumber);
  });
  return leaves;
}

// ── Layout ────────────────────────────────────────────────────
const VW=1920, VH=1080, CX=960;
const BOX_W=216, BOX_H=132, ROW_H=66;
const FLAG_R=26;
const TOP_PAD=72, BOT_PAD=24;
const SLOT_H = Math.floor((VH - TOP_PAD - BOT_PAD) / 4);  // 4 slot per lato

const FINAL_W = 264;
const FINAL_H = 100;
const WINNER_W = 280;
const WINNER_H = 66;

// 3 colonne per lato (Ottavi, Quarti, Semifinali) + blocco centrale.
const X = {
  r16L: 24,
  qfL:  292,
  sfL:  560,
  fin:  CX - FINAL_W/2,
  sfR:  VW - 560 - BOX_W,
  qfR:  VW - 292 - BOX_W,
  r16R: VW - 24  - BOX_W,
};

function slotY(i)  { return TOP_PAD + i*SLOT_H + Math.floor((SLOT_H-BOX_H)/2); }
function slotCY(i) { return slotY(i) + BOX_H/2; }

// ── Riordino ad albero per POSIZIONE REALE ──────────────────────
function reorderRound(round, prevRound, prevPosMap) {
  const prevByNum = {};
  prevRound.forEach(m => { prevByNum[m.matchNumber] = m; });
  const keyed = round.map(m => {
    const refs = parentNums(m, prevByNum);
    const positions = refs.map(r => prevPosMap[r]).filter(p => p !== undefined);
    const key = positions.length ? Math.min(...positions) : 999;
    return { key, m };
  });
  keyed.sort((a,b) => a.key - b.key);
  return keyed.map(k => k.m);
}

function buildOrderedRounds(r16, qf, sf) {
  // r16 arriva già in ordine-albero (computeR16Order in buildSVG)
  const r16pos = {};
  r16.forEach((m,i) => { r16pos[m.matchNumber] = i; });
  const qford = reorderRound(qf, r16, r16pos);
  const qfpos = {};
  qford.forEach((m,i) => { qfpos[m.matchNumber] = i; });
  const sford = reorderRound(sf, qford, qfpos);
  return { r16, qf: qford, sf: sford };
}

// ── Box match VERTICALE (2 righe impilate) — Ottavi..Semifinali ──
function drawBox(parent, defs, match, bx, by) {
  const winner = match?.winner || null;
  const homeWin = winner && match?.home?.name && winner===match.home.name;
  const awayWin = winner && match?.away?.name && winner===match.away.name;

  ap(parent,
    se('rect',{x:bx,y:by,width:BOX_W,height:BOX_H,rx:9,
      fill:C.boxBg,
      stroke:(homeWin||awayWin)?C.borderW:C.border,
      'stroke-width':(homeWin||awayWin)?2.4:1.3}),
    se('line',{x1:bx,y1:by+ROW_H,x2:bx+BOX_W,y2:by+ROW_H,
      stroke:'rgba(255,255,255,0.12)','stroke-width':1})
  );

  function drawRow(team, ry, isWin, isElim) {
    const name = team?.name || null;
    let ph     = team?.placeholder || 'TBD';
    if (/^Vincente/i.test(ph)) ph = 'Vincente';
    else if (/^Perdente/i.test(ph)) ph = 'Perdente';
    const flag = team?.flag || FLAG_FB;
    const op   = isElim ? 0.28 : 1;
    const g    = se('g',{opacity:op});

    if (isWin) ap(g, se('rect',{x:bx,y:ry,width:BOX_W,height:ROW_H,fill:C.winBg}));

    const fcx = bx + 12 + FLAG_R;
    const fcy = ry + ROW_H/2;
    const cid = 'f'+(++_cn);
    ap(defs, ap(se('clipPath',{id:cid}), se('circle',{cx:fcx,cy:fcy,r:FLAG_R})));

    if (name) {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R+2.5,
          fill:'none', stroke:isWin?C.gold:C.border,
          'stroke-width':isWin?2.8:1.4}),
        ap(se('g',{'clip-path':`url(#${cid})`}), (()=>{
          const img=se('image',{
            href:flag, x:fcx-FLAG_R, y:fcy-FLAG_R,
            width:FLAG_R*2, height:FLAG_R*2,
            preserveAspectRatio:'xMidYMid slice'
          });
          img.setAttribute('onerror',`this.setAttribute('href','${FLAG_FB}')`);
          return img;
        })())
      );
    } else {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R,fill:'rgba(255,255,255,0.05)',stroke:C.muted,'stroke-width':1.4}),
        st('?',{x:fcx,y:fcy+8,'text-anchor':'middle','font-size':24,fill:C.muted,'font-weight':800})
      );
    }

    const tx = bx + 12 + FLAG_R*2 + 14;
    const tw = BOX_W - (12+FLAG_R*2+14) - 8;
    const tcid = 'n'+(++_cn);
    ap(defs, ap(se('clipPath',{id:tcid}), se('rect',{x:tx,y:ry,width:tw,height:ROW_H})));
    ap(g, st(name||ph, {
      x:tx, y:ry+ROW_H/2+8,
      'font-size': name?23:18,
      fill: name?(isWin?C.gold2:C.white):C.gold2,
      'font-weight': name?(isWin?800:600):800,
      'clip-path':`url(#${tcid})`
    }));

    parent.appendChild(g);
  }

  drawRow(match?.home, by,       homeWin, !homeWin&&awayWin);
  drawRow(match?.away, by+ROW_H, awayWin, !awayWin&&homeWin);
}

// ── Box ORIZZONTALE (Finale / 3°posto): 2 squadre affiancate ────
function drawHBox(parent, defs, match, bx, by) {
  const winner = match?.winner || null;
  const homeWin = winner && match?.home?.name && winner===match.home.name;
  const awayWin = winner && match?.away?.name && winner===match.away.name;
  const halfW = FINAL_W/2;

  ap(parent,
    se('rect',{x:bx,y:by,width:FINAL_W,height:FINAL_H,rx:10,
      fill:C.boxBg,
      stroke:(homeWin||awayWin)?C.borderW:C.border,
      'stroke-width':(homeWin||awayWin)?2.6:1.5}),
    se('line',{x1:bx+halfW,y1:by,x2:bx+halfW,y2:by+FINAL_H,
      stroke:'rgba(255,255,255,0.14)','stroke-width':1}),
    st('VS',{x:bx+halfW,y:by+FINAL_H/2+6,'text-anchor':'middle',
      'font-size':15,fill:'rgba(255,255,255,0.30)','font-weight':800})
  );

  function drawSide(team, side, isWin, isElim) {
    const name = team?.name || null;
    let ph     = team?.placeholder || 'TBD';
    if (/^Vincente/i.test(ph)) ph = 'Vincente';
    else if (/^Perdente/i.test(ph)) ph = 'Perdente';
    const flag = team?.flag || FLAG_FB;
    const op   = isElim ? 0.3 : 1;
    const g = se('g',{opacity:op});
    const cx0 = side==='L' ? bx : bx+halfW;

    if (isWin) ap(g, se('rect',{x:cx0,y:by,width:halfW,height:FINAL_H,fill:C.winBg}));

    const fcy = by + FINAL_H/2 - 14;
    const fcx = cx0 + halfW/2;
    const cid = 'hf'+(++_cn);
    ap(defs, ap(se('clipPath',{id:cid}), se('circle',{cx:fcx,cy:fcy,r:FLAG_R+2})));

    if (name) {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R+4,fill:'none',
          stroke:isWin?C.gold:C.border,'stroke-width':isWin?2.8:1.4}),
        ap(se('g',{'clip-path':`url(#${cid})`}),(()=>{
          const img=se('image',{href:flag,x:fcx-FLAG_R-2,y:fcy-FLAG_R-2,
            width:(FLAG_R+2)*2,height:(FLAG_R+2)*2,preserveAspectRatio:'xMidYMid slice'});
          img.setAttribute('onerror',`this.setAttribute('href','${FLAG_FB}')`);
          return img;
        })())
      );
    } else {
      ap(g,
        se('circle',{cx:fcx,cy:fcy,r:FLAG_R+2,fill:'rgba(255,255,255,0.05)',stroke:C.muted,'stroke-width':1.4}),
        st('?',{x:fcx,y:fcy+8,'text-anchor':'middle','font-size':24,fill:C.muted,'font-weight':800})
      );
    }

    const tcid = 'ht'+(++_cn);
    ap(defs, ap(se('clipPath',{id:tcid}), se('rect',{x:cx0+4,y:by+FINAL_H-30,width:halfW-8,height:24})));
    ap(g, st(name||ph,{
      x:fcx, y:by+FINAL_H-12,
      'text-anchor':'middle',
      'font-size': name?17:14,
      fill: name?(isWin?C.gold2:C.white):C.gold2,
      'font-weight': 800,
      'clip-path':`url(#${tcid})`
    }));

    parent.appendChild(g);
  }

  drawSide(match?.home,'L', homeWin, !homeWin&&awayWin);
  drawSide(match?.away,'R', awayWin, !awayWin&&homeWin);
}

// ── Box singolo vincitore (Campione / 3° posto) ─────────────────
function drawWinnerBox(parent, defs, y, teamName, teamFlag, accentColor) {
  const bx = CX - WINNER_W/2;
  const by = y;

  ap(parent, se('rect',{
    x:bx, y:by, width:WINNER_W, height:WINNER_H, rx:10,
    fill:'rgba(8,8,24,0.85)',
    stroke: teamName ? accentColor : C.border,
    'stroke-width': teamName ? 2.8 : 1.5
  }));

  if (teamName) {
    const fcx = bx + 38, fcy = by + WINNER_H/2;
    const cid = 'wb'+(++_cn);
    ap(defs, ap(se('clipPath',{id:cid}), se('circle',{cx:fcx,cy:fcy,r:FLAG_R+1})));
    ap(parent,
      se('circle',{cx:fcx,cy:fcy,r:FLAG_R+3,fill:'none',stroke:accentColor,'stroke-width':2.8}),
      ap(se('g',{'clip-path':`url(#${cid})`}),(()=>{
        const img=se('image',{href:teamFlag||FLAG_FB,x:fcx-FLAG_R-1,y:fcy-FLAG_R-1,
          width:(FLAG_R+1)*2,height:(FLAG_R+1)*2,preserveAspectRatio:'xMidYMid slice'});
        img.setAttribute('onerror',`this.setAttribute('href','${FLAG_FB}')`);
        return img;
      })()),
      st(teamName,{x:fcx+38,y:fcy+8,'font-size':24,fill:accentColor==C.gold?C.gold2:C.bronze2,'font-weight':900})
    );
  } else {
    ap(parent,
      se('circle',{cx:bx+38,cy:by+WINNER_H/2,r:FLAG_R+1,fill:'rgba(255,255,255,0.05)',stroke:C.muted,'stroke-width':1.4}),
      st('?',{x:bx+38,y:by+WINNER_H/2+8,'text-anchor':'middle','font-size':24,fill:C.muted,'font-weight':800}),
      st('Da determinare',{x:bx+76,y:by+WINNER_H/2+8,'font-size':18,fill:C.muted,'font-style':'italic','font-weight':600})
    );
  }
}

// ── Connettori con bordo rosso e centro blu notte ────────────────
function hline(g, x1, x2, y) {
  ap(g,
    se('line',{x1,y1:y,x2,y2:y,stroke:C.lineEdge,'stroke-width':6,'stroke-linecap':'round'}),
    se('line',{x1,y1:y,x2,y2:y,stroke:C.line,'stroke-width':2.8,'stroke-linecap':'round'})
  );
}
function vline(g, x, y1, y2) {
  ap(g,
    se('line',{x1:x,y1,x2:x,y2,stroke:C.lineEdge,'stroke-width':6,'stroke-linecap':'round'}),
    se('line',{x1:x,y1,x2:x,y2,stroke:C.line,'stroke-width':2.8,'stroke-linecap':'round'})
  );
}
function pathConn(g, d) {
  ap(g,
    se('path',{d, stroke:C.lineEdge,'stroke-width':6,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}),
    se('path',{d, stroke:C.line,'stroke-width':2.8,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'})
  );
}
function colLabel(g, label, cx, y) {
  ap(g,
    st(label,{x:cx,y,'text-anchor':'middle','font-size':36,
      fill:'#ffffff','font-weight':900,'letter-spacing':3.5,
      stroke:'rgba(0,0,0,0.9)','stroke-width':1})
  );
}

// ── SVG principale ────────────────────────────────────────────
function buildSVG(data) {
  // Ottavi in ordine-albero PRIMA di tutto → disegno indipendente
  // dall'ordine dell'array nel JSON.
  const r16raw = data.bracket.round_of_16 || [];
  const r16byNum0 = {};
  r16raw.forEach(m => { r16byNum0[m.matchNumber] = m; });
  const r16sorted = computeR16Order(data.bracket)
    .map(n => r16byNum0[n])
    .filter(Boolean);

  const ord = buildOrderedRounds(
    r16sorted,
    data.bracket.quarter_finals || [],
    data.bracket.semi_finals    || []
  );
  const r16 = ord.r16, qf = ord.qf, sf = ord.sf;
  const tp  = data.bracket.third_place;
  const fin = data.bracket.final;

  const svg = se('svg',{viewBox:`0 0 ${VW} ${VH}`,xmlns:NS,
    style:'display:block;width:100%;height:auto'});

  const defs = se('defs');
  svg.appendChild(defs);

  const bgImg = se('image',{href:'assets/bg.jpg',x:0,y:0,width:VW,height:VH,
    preserveAspectRatio:'xMidYMid slice'});
  svg.appendChild(bgImg);
  svg.appendChild(se('rect',{x:0,y:0,width:VW,height:VH,fill:'rgba(20,22,35,0.48)'}));

  const gL = se('g',{id:'lines'});
  const gB = se('g',{id:'boxes'});
  const gT = se('g',{id:'top'});
  ap(svg, gL, gB, gT);

  // ── Etichette fase ──────────────────────────────────────────
  const LY = 85;
  colLabel(gT,'OTTAVI',     X.r16L+BOX_W/2, LY);
  colLabel(gT,'QUARTI',     X.qfL +BOX_W/2, LY);
  colLabel(gT,'SEMIFINALI', X.sfL +BOX_W/2, LY);
  colLabel(gT,'SEMIFINALI', X.sfR +BOX_W/2, LY);
  colLabel(gT,'QUARTI',     X.qfR +BOX_W/2, LY);
  colLabel(gT,'OTTAVI',     X.r16R+BOX_W/2, LY);

  // ── Geometria per posizione. Le linee seguono i veri genitori;
  // se un genitore è a Y diversa la linea diventa un percorso ad
  // angolo (orizz-vert-orizz). ──
  function pairCY(getCY, i) { return (getCY(2*i) + getCY(2*i+1)) / 2; }
  const r16CYL = i => slotCY(i);
  const qfCYL  = i => pairCY(r16CYL, i);
  const sfLY   = (qfCYL(0)+qfCYL(1))/2;
  const r16CYR = i => slotCY(i);
  const qfCYR  = i => pairCY(r16CYR, i);
  const sfRY   = (qfCYR(0)+qfCYR(1))/2;

  const posByNum = {};
  r16.slice(0,4).forEach((m,i) => { posByNum[m.matchNumber] = {x:X.r16L+BOX_W, y:r16CYL(i)}; });
  r16.slice(4,8).forEach((m,i) => { posByNum[m.matchNumber] = {x:X.r16R,      y:r16CYR(i)}; });
  qf.slice(0,2).forEach((m,i) => { posByNum[m.matchNumber] = {x:X.qfL+BOX_W, y:qfCYL(i)}; });
  qf.slice(2,4).forEach((m,i) => { posByNum[m.matchNumber] = {x:X.qfR,      y:qfCYR(i)}; });
  if (sf[0]) posByNum[sf[0].matchNumber] = {x:X.sfL+BOX_W, y:sfLY};
  if (sf[1]) posByNum[sf[1].matchNumber] = {x:X.sfR,      y:sfRY};

  function drawParentLines(match, prevByNum, destX, isRightSide) {
    const refs = ['home','away'].map(s => findOriginNum(match[s], prevByNum)).filter(n => n !== null);
    refs.forEach(refNum => {
      const parent = posByNum[refNum];
      if (!parent) return;
      const startX = parent.x, startY = parent.y;
      const endX = destX, endY = posByNum[match.matchNumber].y;
      if (Math.abs(startY - endY) < 1) {
        hline(gL, isRightSide?endX:startX, isRightSide?startX:endX, startY);
      } else {
        const midX = (startX + endX) / 2;
        pathConn(gL, `M${startX},${startY} H${midX} V${endY} H${endX}`);
      }
    });
  }

  const r16ByNum = {}; r16.forEach(m => { r16ByNum[m.matchNumber] = m; });
  const qfByNum  = {}; qf.forEach(m => { qfByNum[m.matchNumber] = m; });

  // ── LATO SINISTRO ════════════════════════════════════════════
  for (let i=0;i<4;i++) drawBox(gB, defs, r16[i], X.r16L, r16CYL(i)-BOX_H/2);
  for (let i=0;i<2;i++) {
    const m = qf[i];
    drawBox(gB, defs, m, X.qfL, qfCYL(i)-BOX_H/2);
    drawParentLines(m, r16ByNum, X.qfL, false);
  }
  if (sf[0]) {
    drawBox(gB, defs, sf[0], X.sfL, sfLY-BOX_H/2);
    drawParentLines(sf[0], qfByNum, X.sfL, false);
  }

  // ── LATO DESTRO ══════════════════════════════════════════════
  for (let i=0;i<4;i++) drawBox(gB, defs, r16[4+i], X.r16R, r16CYR(i)-BOX_H/2);
  for (let i=0;i<2;i++) {
    const m = qf[2+i];
    drawBox(gB, defs, m, X.qfR, qfCYR(i)-BOX_H/2);
    drawParentLines(m, r16ByNum, X.qfR+BOX_W, true);
  }
  if (sf[1]) {
    drawBox(gB, defs, sf[1], X.sfR, sfRY-BOX_H/2);
    drawParentLines(sf[1], qfByNum, X.sfR+BOX_W, true);
  }

  // ══ CENTRO ══════════════════════════════════════════════════
  // La finale è centrata verticalmente sulle semifinali (finCY = sfLY),
  // così i due connettori Semifinale→Finale sono orizzontali e puliti.
  const finBX = CX - FINAL_W/2;
  const finCY = sfLY;
  const finY  = finCY - FINAL_H/2;

  // Trofeo + label + box campione, impilati SOPRA la finale
  const champBoxY   = finY - 50 - WINNER_H;
  const champLabelY = champBoxY - 24;
  const tW = 120, tH = 168;
  const trophyY = champLabelY - 30 - tH;
  svg.appendChild(se('image',{href:'assets/trophy.png',x:CX-tW/2,y:trophyY,width:tW,height:tH,
    preserveAspectRatio:'xMidYMid meet'}));

  ap(gT, st('CAMPIONE DEL MONDO',{
    x:CX, y:champLabelY, 'text-anchor':'middle',
    'font-size':30, fill:C.gold, 'font-weight':900, 'letter-spacing':5,
    stroke:C.navyText, 'stroke-width':1.4, 'paint-order':'stroke'
  }));

  drawWinnerBox(gB, defs, champBoxY, fin?.winner || null,
    fin?.winner ? (fin.winner===fin.home?.name ? fin.home.flag : fin.away?.flag) : null,
    C.gold);

  vline(gL, CX, champBoxY+WINNER_H, finY);
  drawHBox(gB, defs, fin, finBX, finY);

  ap(gT, st('FINALE',{
    x:CX, y:finY+FINAL_H+30, 'text-anchor':'middle',
    'font-size':30, fill:'#ffffff', 'font-weight':900, 'letter-spacing':3.5,
    stroke:'rgba(0,0,0,0.9)','stroke-width':1
  }));

  // Connettori Semifinale → Finale (orizzontali: sfLY === finCY === sfRY)
  if (Math.abs(sfLY - finCY) > 1) {
    const midX = (X.sfL+BOX_W + finBX)/2;
    pathConn(gL, `M${X.sfL+BOX_W},${sfLY} H${midX} V${finCY} H${finBX}`);
  } else {
    hline(gL, X.sfL+BOX_W, finBX, finCY);
  }
  if (Math.abs(sfRY - finCY) > 1) {
    const midX2 = (finBX+FINAL_W + X.sfR)/2;
    pathConn(gL, `M${X.sfR},${sfRY} H${midX2} V${finCY} H${finBX+FINAL_W}`);
  } else {
    hline(gL, finBX+FINAL_W, X.sfR, finCY);
  }

  // ── Blocco 3° posto, SOTTO la finale ────────────────────────
  const medalSize = 70;
  const medalY = finY + FINAL_H + 56;

  const medalImgAspect = 1200/680;
  const medalImgW = medalSize * medalImgAspect;
  const medalImgX = CX - medalImgW/2;
  const medalClipId = 'medalClip';
  ap(defs, ap(se('clipPath',{id:medalClipId}),
    se('circle',{cx:CX, cy:medalY+medalSize/2, r:medalSize/2})
  ));
  svg.appendChild(se('image',{
    href:'assets/bronze.png',
    x:medalImgX, y:medalY, width:medalImgW, height:medalSize,
    preserveAspectRatio:'xMidYMid slice',
    'clip-path':`url(#${medalClipId})`
  }));

  const medalLabelY = medalY + medalSize + 28;
  ap(gT, st('TERZO POSTO',{
    x:CX, y:medalLabelY, 'text-anchor':'middle',
    'font-size':24, fill:C.bronze, 'font-weight':900, 'letter-spacing':4,
    stroke:C.navyText, 'stroke-width':1.2, 'paint-order':'stroke'
  }));

  const medalBoxY = medalLabelY + 16;
  const tpWinner = tp?.winner || null;
  const tpWinnerFlag = tpWinner ? (tpWinner===tp?.home?.name ? tp.home.flag : tp?.away?.flag) : null;
  drawWinnerBox(gB, defs, medalBoxY, tpWinner, tpWinnerFlag, C.bronze);

  const tpCY = medalBoxY + WINNER_H + 40 + FINAL_H/2;
  const tpY  = tpCY - FINAL_H/2;
  vline(gL, CX, medalBoxY+WINNER_H, tpY);
  drawHBox(gB, defs, tp, finBX, tpY);

  ap(gT, st('FINALE',{
    x:CX, y:tpY+FINAL_H+30, 'text-anchor':'middle',
    'font-size':30, fill:'#ffffff', 'font-weight':900, 'letter-spacing':3.5,
    stroke:'rgba(0,0,0,0.9)','stroke-width':1
  }));

  return svg;
}

// ── Main ─────────────────────────────────────────────────────
async function load() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('data/worldcup.json?v='+Date.now());
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    app.innerHTML = '';
    app.appendChild(buildSVG(data));
  } catch(e) {
    app.innerHTML = `<div class="error-screen">
      <div class="et">FIFA WORLD CUP 2026</div>
      <div>Dati non disponibili.</div>
      <div style="font-size:12px;opacity:.4;margin-top:6px;">Riprova più tardi.</div>
    </div>`;
  }
}

load();
</script>
</body>
</html>
