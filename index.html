<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classifiche</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #000;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .wrapper {
      width: 100%;
      max-width: none;
      margin: 0 auto;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 100vh;
      border-radius: 0;
      overflow: hidden;
      background: transparent !important;
      border: none !important;
    }

    .widget-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.01);
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
      overflow: hidden;
    }

    .widget-slide.active {
      opacity: 1;
      pointer-events: none;
      transform: scale(1);
    }

    .standings-widget {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #141416;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      padding-bottom: 50px;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 12px;
    }

    .standings-widget::-webkit-scrollbar { width: 0; height: 0; }
    .standings-widget { scrollbar-width: none; }

    @media (min-width: 770px) {
      .standings-widget { padding-right: 32px; }
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .standings-table thead tr {
      background-color: #f3f8fd;
      color: #141416;
      font-size: 11px;
    }

    .standings-table thead th {
      padding: 6px 4px;
      text-align: center;
      font-weight: 600;
      border-bottom: 1px solid #ecf1f7;
    }

    .standings-table thead th.team-col {
      text-align: left;
      padding-left: 8px;
    }

    .standings-table tbody tr {
      border-bottom: 1px solid #ecf1f7;
      transition: background 0.2s;
    }

    .standings-table tbody tr:hover {
      background-color: #f9fbff;
    }

    .standings-table tbody td {
      padding: 5px 4px;
      text-align: center;
      color: #141416;
    }

    .standings-table tbody td.team-col {
      text-align: left;
      padding-left: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .pos-cell { width: 24px; font-weight: 600; }
    .points-cell { font-weight: 700; }

    .widget-footer {
      text-align: center;
      padding: 8px;
      font-size: 10px;
      color: #999;
    }

    .widget-footer a { color: #141416; text-decoration: none; }

    .last-updated {
      text-align: center;
      padding: 4px 8px 0;
      font-size: 10px;
      color: #aaa;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 13px;
      color: #999;
    }

    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 12px;
      color: #ef4444;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="slider">

    <!-- SLIDE 1 – SERIE A -->
    <div class="widget-slide active" data-src="data/seriea.json" data-name="Serie A">
      <div class="standings-widget">
        <div class="loading">Caricamento Serie A…</div>
      </div>
    </div>

    <!-- SLIDE 2 – CHAMPIONS -->
    <div class="widget-slide" data-src="data/champions.json" data-name="Champions League">
      <div class="standings-widget">
        <div class="loading">Caricamento Champions League…</div>
      </div>
    </div>

  </div>
</div>

<script>
  const slides = document.querySelectorAll('.widget-slide');

  function renderStandings(container, json) {
    const table = json.standings?.find(s => s.type === 'TOTAL');
    if (!table) {
      container.innerHTML = '<div class="error">Dati non disponibili.</div>';
      return;
    }

    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${hh}:${mm}`;

    const rows = table.table.map(entry => `
      <tr>
        <td class="pos-cell">${entry.position}</td>
        <td class="team-col">
          <img class="team-logo"
               src="${entry.team.crest}"
               alt="${entry.team.shortName}"
               onerror="this.style.display='none'" />
          <span class="team-name">${entry.team.shortName || entry.team.name}</span>
        </td>
        <td>${entry.playedGames}</td>
        <td>${entry.won}</td>
        <td>${entry.draw}</td>
        <td>${entry.lost}</td>
        <td class="points-cell">${entry.points}</td>
      </tr>`
    ).join('');

    container.innerHTML = `
      <table class="standings-table">
        <thead>
          <tr>
            <th class="pos-cell">#</th>
            <th class="team-col">Squadra</th>
            <th>PG</th>
            <th>V</th>
            <th>N</th>
            <th>P</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="last-updated">Aggiornato alle ${timeStr}</div>
      <div class="widget-footer">
        Live data by <a href="https://www.football-data.org/">football-data.org</a>
      </div>`;
  }

  async function loadSlide(slide) {
    const src = slide.dataset.src;
    const container = slide.querySelector('.standings-widget');
    if (!src || container.dataset.loaded) return;

    try {
      const res = await fetch(src + '?v=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      renderStandings(container, json);
      container.dataset.loaded = '1';
    } catch (e) {
      container.innerHTML = '<div class="error">Errore nel caricamento dei dati.<br>Riprova più tardi.</div>';
    }
  }

  function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  const SCROLL_CONFIG = [
    { before: 3000, duration: 15000, after: 4000 },
    { before: 3000, duration: 22000, after: 4000 }
  ];

  let currentIndex = 0;
  let scrollAnimId = null;
  let pauseTimeoutId = null;
  let beforeTimeoutId = null;

  function clearTimers() {
    cancelAnimationFrame(scrollAnimId);
    clearTimeout(pauseTimeoutId);
    clearTimeout(beforeTimeoutId);
  }

  function showSlide(index) {
    clearTimers();
    slides.forEach((s, i) => s.classList.toggle('active', i === index));

    const slide = slides[index];
    const cfg = SCROLL_CONFIG[index];

    loadSlide(slide);

    beforeTimeoutId = setTimeout(() => {
      startAutoScroll(slide, cfg);
    }, cfg.before + 800);
  }

  function startAutoScroll(slide, cfg) {
    const widget = slide.querySelector('.standings-widget');
    if (!widget) { pauseTimeoutId = setTimeout(nextSlide, cfg.after); return; }

    widget.scrollTop = 0;
    if (widget.scrollHeight <= widget.clientHeight) {
      pauseTimeoutId = setTimeout(nextSlide, cfg.after);
      return;
    }

    const startTime = performance.now();

    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / cfg.duration, 1);
      const eased = easeInOutQuad(progress);
      const maxScroll = widget.scrollHeight - widget.clientHeight;
      widget.scrollTop = maxScroll * eased;

      if (progress < 1) {
        scrollAnimId = requestAnimationFrame(step);
      } else {
        widget.scrollTop = maxScroll;
        pauseTimeoutId = setTimeout(nextSlide, cfg.after);
      }
    }

    scrollAnimId = requestAnimationFrame(step);
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }

  slides.forEach(s => loadSlide(s));
  showSlide(currentIndex);
</script>

</body>
</html>
